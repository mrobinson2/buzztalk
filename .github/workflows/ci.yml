name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/attach-release.sh tests/installers.sh tests/release-workflow.sh
      - name: Release attachment tests
        if: runner.os == 'Linux'
        run: tests/release-workflow.sh
      - name: Installer behavior tests
        if: runner.os != 'Windows'
        run: tests/installers.sh
      - name: PowerShell installer behavior tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installers.ps1

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # rust-cache can restore sherpa-onnx-sys build metadata without the
      # crate's custom target/sherpa-onnx-prebuilt directory. Force its build
      # script to rerun so the native libraries and link path stay in sync.
      - name: Refresh sherpa-onnx native link cache
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean -p sherpa-onnx-sys
      # cpal needs ALSA headers on Linux. There is no audio device in CI —
      # every test that needs real hardware is #[ignore]d.
      - name: Install Linux audio dev packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
