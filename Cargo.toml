[workspace]
resolver = "2"
members = [
    "crates/buzztalk-core",
    "crates/buzztalk-audio",
    "crates/buzztalk-aec",
    "crates/buzztalk-labs",
    "crates/buzztalk-vad",
    "crates/buzztalk-stt",
    "crates/buzztalk-session",
    "crates/buzztalk-tts",
    "crates/buzztalk-pipeline",
    "crates/buzztalk-buzz",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/mrobinson2/buzztalk"
description = "Full-duplex voice conversation layer for Buzz"

[workspace.dependencies]
buzztalk-core = { path = "crates/buzztalk-core" }
buzztalk-aec = { path = "crates/buzztalk-aec" }
buzztalk-audio = { path = "crates/buzztalk-audio" }
buzztalk-vad = { path = "crates/buzztalk-vad" }
buzztalk-stt = { path = "crates/buzztalk-stt" }
buzztalk-session = { path = "crates/buzztalk-session" }
buzztalk-tts = { path = "crates/buzztalk-tts" }
buzztalk-pipeline = { path = "crates/buzztalk-pipeline" }
buzztalk-buzz = { path = "crates/buzztalk-buzz" }
thiserror = "2"
