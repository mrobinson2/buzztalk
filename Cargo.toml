[workspace]
resolver = "2"
members = [
    "crates/buzztalk-core",
    "crates/buzztalk-audio",
    "crates/buzztalk-aec",
    "crates/buzztalk-labs",
    "crates/buzztalk-vad",
    "crates/buzztalk-stt",
    "crates/buzztalk-session",
    "crates/buzztalk-tts",
    "crates/buzztalk-pipeline",
    "crates/buzztalk-buzz",
    "crates/buzztalk-models",
    "crates/buzztalk-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/mrobinson2/buzztalk"
description = "Full-duplex voice conversation layer for Buzz"

[workspace.dependencies]
buzztalk-core = { path = "crates/buzztalk-core", version = "0.1.0" }
buzztalk-aec = { path = "crates/buzztalk-aec", version = "0.1.0" }
buzztalk-audio = { path = "crates/buzztalk-audio", version = "0.1.0" }
buzztalk-vad = { path = "crates/buzztalk-vad", version = "0.1.0" }
buzztalk-stt = { path = "crates/buzztalk-stt", version = "0.1.0" }
buzztalk-session = { path = "crates/buzztalk-session", version = "0.1.0" }
buzztalk-tts = { path = "crates/buzztalk-tts", version = "0.1.0" }
buzztalk-pipeline = { path = "crates/buzztalk-pipeline", version = "0.1.0" }
buzztalk-buzz = { path = "crates/buzztalk-buzz", version = "0.1.0" }
buzztalk-models = { path = "crates/buzztalk-models", version = "0.1.0" }
thiserror = "2"
